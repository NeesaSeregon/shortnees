name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shortnees

    steps:
      - uses: actions/checkout@v4

      # Angular 18 admite Node ^18.19 || ^20.11 || ^22
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shortnees/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Karma necesita saber donde esta el navegador. Se resuelve aqui en vez de
      # dar por hecha una ruta, que cambia entre imagenes del runner.
      - name: Localizar Chrome
        run: |
          RUTA="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)"
          if [ -z "$RUTA" ]; then
            echo "No se ha encontrado ningun Chrome en el runner" >&2
            exit 1
          fi
          echo "CHROME_BIN=$RUTA" >> "$GITHUB_ENV"
          echo "Usando $RUTA"

      - name: Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build de produccion
        run: npm run build

  backend:
    name: Symfony
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApiShortnees

    # Los tests funcionales necesitan una base real: las migraciones son SQL de
    # MySQL (AUTO_INCREMENT, ENGINE = InnoDB) y no correrian sobre SQLite.
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Credenciales de un contenedor efimero, alcanzable solo desde este job:
      # no son un secreto. Doctrine le anade el sufijo _test (bloque when@test
      # de doctrine.yaml), asi que la base atacada es webtools_test.
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/webtools?serverVersion=10.4.28-MariaDB&charset=utf8mb4"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # intl lo necesita \Locale::getDisplayRegion, que traduce el codigo
          # ISO del pais al nombre en espanol.
          extensions: pdo_mysql, intl, openssl
          coverage: none

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress

      - name: Comprobar sintaxis de PHP
        run: find src migrations tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Validar composer.json
        run: composer validate --no-check-publish

      - name: Avisos de seguridad de las dependencias
        # Informativo mientras Symfony siga en 7.1, que ya no recibe parches.
        run: composer audit --no-dev || true

      # Par de claves de usar y tirar, generado aqui. Las de verdad no estan en
      # el repositorio y nunca deben estarlo.
      - name: Generar el par de claves JWT de tests
        run: php bin/console lexik:jwt:generate-keypair --env=test --no-interaction

      - name: Preparar la base de datos de tests
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Tests
        run: php bin/phpunit
