<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Shortnees</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- El .ico va primero para los navegadores viejos; el SVG lo prefieren los
       modernos y escala a cualquier tamano. El anterior era un PNG de 107x66
       renombrado a .ico, trazo negro sin fondo que desaparecia en pestana oscura. -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Los iconos van en SVG dentro de IconoComponent. Antes se cargaba la
       fuente Bootstrap Icons desde jsdelivr: ~200 kB y ~2000 glifos para usar
       25, mas otra peticion a un tercero que ve la IP del visitante. -->
  <!-- Las tres familias del sistema visual se autoalojan en public/fuentes/ y
       se declaran con @font-face en styles.css. No se piden a Google: eso
       enviaba la IP de cada visitante a un tercero, justo lo que este proyecto
       evita al no guardar la IP (RGPD art. 5.1.c). -->
</head>
<body class="theme-dark">
  <app-root></app-root>
</body>
</html>
