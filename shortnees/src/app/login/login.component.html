<main class="auth-main">
  <div class="container auth-container">

    <div class="auth-intro">
      <span class="auth-marca" aria-hidden="true"><app-icono nombre="box-arrow-in-right" /></span>
      <h1 class="auth-title">Iniciar sesión</h1>
      <p class="auth-subtitle">Entra para personalizar tus enlaces y ver sus estadísticas.</p>
    </div>

    <div class="auth-card">
      <form class="auth-form" [formGroup]="formularioLogin" (ngSubmit)="iniciarSesion()">

        <div class="auth-field">
          <label for="correo" class="auth-label">Email</label>
          <div class="auth-input-group">
            <span class="auth-input-icono" aria-hidden="true"><app-icono nombre="envelope" /></span>
            <input type="email" class="auth-input" id="correo" formControlName="correo"
                   placeholder="tu@correo.com" autocomplete="email" required>
          </div>
        </div>

        <div class="auth-field">
          <label for="password" class="auth-label">Contraseña</label>
          <div class="auth-input-group">
            <span class="auth-input-icono" aria-hidden="true"><app-icono nombre="lock" /></span>
            <input type="password" class="auth-input" id="password" formControlName="password"
                   placeholder="Tu contraseña" autocomplete="current-password" required>
          </div>
        </div>

        @if (error() !== '') {
          <p class="error auth-error" role="alert">
            <app-icono nombre="exclamation-circle-fill" />
            {{ error() }}
          </p>
        }

        <button type="submit" class="auth-btn">Iniciar sesión</button>
      </form>
    </div>

    <!-- routerLink y no un boton con router.navigate(): es una navegacion, y
         asi el enlace se puede abrir en otra pestaña como cualquier otro. -->
    <p class="auth-pie">
      ¿Todavía no tienes cuenta? <a routerLink="/registro" class="auth-enlace">Crear cuenta</a>
    </p>

  </div>
</main>
