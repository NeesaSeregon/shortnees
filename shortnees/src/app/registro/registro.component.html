<main class="auth-main">
  <div class="container auth-container">

    <div class="auth-intro">
      <span class="auth-marca" aria-hidden="true"><i class="bi bi-person-plus"></i></span>
      <h1 class="auth-title">Crear cuenta</h1>
      <p class="auth-subtitle">Elige tú el código de tus enlaces y mide cada clic. Es gratis.</p>
    </div>

    <div class="auth-card">
      <form class="auth-form" [formGroup]="formularioRegistro" (ngSubmit)="submit()">

        <div class="auth-field">
          <label for="nombre" class="auth-label">Nombre</label>
          <div class="auth-input-group">
            <span class="auth-input-icono" aria-hidden="true"><i class="bi bi-person"></i></span>
            <input type="text" class="auth-input" id="nombre" formControlName="nombre"
                   placeholder="Cómo quieres que te llamemos" autocomplete="nickname" required>
          </div>
          @if (formularioRegistro.get('nombre')?.touched && formularioRegistro.get('nombre')?.errors?.['required']) {
            <small class="auth-hint">El nombre es obligatorio.</small>
          }
        </div>

        <div class="auth-field">
          <label for="email" class="auth-label">Email</label>
          <div class="auth-input-group">
            <span class="auth-input-icono" aria-hidden="true"><i class="bi bi-envelope"></i></span>
            <input type="email" class="auth-input" id="email" formControlName="email"
                   placeholder="tu@correo.com" autocomplete="email" required>
          </div>
        </div>

        <div class="auth-field">
          <label for="password" class="auth-label">Contraseña</label>
          <div class="auth-input-group">
            <span class="auth-input-icono" aria-hidden="true"><i class="bi bi-lock"></i></span>
            <input type="password" class="auth-input" id="password" formControlName="password"
                   placeholder="Elige una contraseña" autocomplete="new-password" required>
          </div>
        </div>

        @if (error() !== '') {
          <p class="error auth-error" role="alert">
            <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
            {{ error() }}
          </p>
        }

        <button type="submit" class="auth-btn">Crear cuenta</button>
      </form>
    </div>

    <!-- Antes era un <button> sin (click): no hacia absolutamente nada. -->
    <p class="auth-pie">
      ¿Ya tienes cuenta? <a routerLink="/login" class="auth-enlace">Iniciar sesión</a>
    </p>

  </div>
</main>
