<header class="header-wrapper">
  <div class="header-content container">
    <a routerLink="/home" class="header-brand">Shortnees</a>
    <nav class="header-nav">
      <a routerLink="/home" routerLinkActive="header-link--activo" class="header-link">Acortador</a>
      @if (!isLoggedIn) {
        <!-- Sin sesion estas dos secciones se enseñan pero llevan al registro:
             son el escaparate de lo que se consigue creando una cuenta. -->
        <a routerLink="/registro" class="header-link header-link--muted"
           title="Regístrate para usar el panel de control">Panel de control</a>
        <a routerLink="/registro" class="header-link header-link--muted"
           title="Regístrate para generar códigos QR">QR</a>
        <div class="header-vr"></div>
        <a routerLink="/login" routerLinkActive="header-link--activo" class="header-link">Login</a>
        <a routerLink="/registro" routerLinkActive="header-link--activo" class="header-link">Registro</a>
      } @else {
        <a routerLink="/dashboard" routerLinkActive="header-link--activo" class="header-link">Panel de control</a>
        <a routerLink="/generador" routerLinkActive="header-link--activo" class="header-link">QR</a>
        <div class="header-vr"></div>
        @if (accesoService.currentUserValue; as user) {
          <a routerLink="/cuenta" routerLinkActive="header-link--activo" class="header-link"
             [title]="'Cuenta de ' + user.nombre">
            <span class="header-avatar">{{ user.nombre.slice(0, 2).toUpperCase() }}</span>
          </a>
        }
        <!-- Boton, no enlace: cerrar sesion es una accion, no una navegacion.
             De la navegacion a /login ya se encarga AccesoService.logout(). -->
        <button type="button" (click)="logout()" class="header-link header-link--boton">
          Cerrar sesión
        </button>
      }
    </nav>
  </div>
  <div class="header-bottom-line"></div>
</header>
