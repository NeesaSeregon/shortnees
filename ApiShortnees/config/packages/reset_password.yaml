symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # El enlace del correo vale una hora.
    lifetime: 3600
    # Una solicitud nueva por cuenta cada 15 minutos como maximo. Es lo que
    # impide usar el formulario para inundar de correos un buzon ajeno.
    throttle_limit: 900
    # Las solicitudes caducadas se borran al crear una nueva. Es la limpieza que
    # en otro servidor haria un cron, y en este cron no funciona.
    enable_garbage_collection: true
